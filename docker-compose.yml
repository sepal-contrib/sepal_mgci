services:
  sepal_mgci:
    build:
      dockerfile: ./Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-""}
    image: "openforis/sepal_mgci"
    container_name: sepal_mgci
    volumes:
      - "${EE_CREDENTIALS_PATH:-${HOME}/.config/earthengine/credentials}:/root/.config/earthengine/credentials"
    environment:
      SEPAL_HOST: "${SEPAL_HOST}"
      FORWARDED_ALLOW_IPS: "*"
      SOLARA_THEME_SHOW_BANNER: "False"
      CARTODB_BASEMAP_KEY: "${CARTODB_BASEMAP_KEY:-}"
      # dev login for running against a SEPAL instance from outside it; real
      # SEPAL headers always win, so it is inert in a deployed container
      PYSEPAL_DEV_AUTH: "${PYSEPAL_DEV_AUTH:-false}"
      # keeps result paths relative to the SEPAL home; this container runs as
      # root, so the absolute form would be rejected on the first write
      DEPLOY_ENV: "${DEPLOY_ENV:-sepal_solara}"
      LOCAL_SEPAL_USER: "${LOCAL_SEPAL_USER:-}"
      LOCAL_SEPAL_PASSWORD: "${LOCAL_SEPAL_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8766"]
      start_period: 60s
      start_interval: 1s
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sepal
    restart: always
    labels:
      org.opencontainers.image.source: https://github.com/sepal-contrib/sepal_mgci
networks:
  sepal:
    external: true